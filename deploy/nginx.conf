# The same thing for nginx, if Caddy is not an option. Put the built frontend
# (Frontend/dist) where `root` points, and run both services on this host.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;          # a quote waits on Aimo's API
    }
    location /gateway/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:8002;
    }
    location / {
        root /srv/junction/frontend;
        try_files $uri /index.html;
    }
}
